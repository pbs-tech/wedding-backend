# PR checks for the Go lambdas. There were none before, which meant a
# dependency bump could only be judged by reading it; this gives the
# auto-merge workflow something real to gate on.
name: CI

on: pull_request

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Build and vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go-version-file keeps this in step with go.mod rather than pinning the
      # toolchain in two places that can drift apart.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # There are no _test.go files in this repository yet. `go test ./...`
      # passes vacuously on a package set with no tests, so running it now means
      # the check starts doing real work the moment a first test is added,
      # rather than needing to be remembered and wired up then.
      - name: Test
        run: go test ./...
